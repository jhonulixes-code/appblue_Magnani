<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block titulo %}
        Mi Aplicación
        {% endblock %}
    </title>
    <!-- Fuente moderna desde CDN -->
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00d4ff;
            --text-color: #e0e0e0;
            --text-muted: #a0a0a0;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            padding: 1.5rem 2rem;
            border-bottom: 2px solid var(--accent-color);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        header h1 {
            color: var(--accent-color);
            font-size: 1.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        main {
            flex: 1;
            max-width: 1000px;
            width: 90%;
            margin: 2rem auto;
            padding: 2rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        footer {
            background-color: var(--card-bg);
            text-align: center;
            padding: 1.2rem 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        footer p {
            margin: 0.3rem 0;
        }

        footer p:first-of-type {
            color: var(--text-color);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Aula__VIRTUAL</h1>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>

    <footer>
        <p>Ingeniería de Sistemas UPEA</p>
        <p>Tecnologías Emergentes II</p>
    </footer>

</body>
</html>
